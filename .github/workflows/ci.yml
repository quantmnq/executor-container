name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: ./scripts/install-ibapi.sh
      - run: .venv/bin/ruff check .
      - run: bash -n follow follow-container follow-stack install.sh deploy/install-bytecode.sh scripts/*.sh
      - run: .venv/bin/python scripts/build-bytecode.py
      - run: .venv/bin/python -m pip install --force-reinstall --no-deps dist/bytecode/*.whl
      - run: .venv/bin/python -I -m unittest discover -s tests -v
      - run: .venv/bin/python scripts/build-executor-container.py
      - run: .venv/bin/python scripts/test-executor-container.py
      - run: .venv/bin/python scripts/test-executor-isolation.py
      # The runtime pins are unchanged. Retain their exact published sources;
      # current Debian indexes can stop listing an installed source version.
      - run: curl --fail --location --retry 3 --output /tmp/follow-dependencies.tar.gz https://github.com/quantmnq/executor-container/releases/download/v0.1.12/follow-executor-0.1.12-dependencies.tar.gz
      - run: .venv/bin/python scripts/collect-third-party-source.py --image follow-executor:0.2.0 --reuse-archive /tmp/follow-dependencies.tar.gz --reuse-sha256 c2740a33b3f91508c70116d4c0a4389b47fe2fd1748b16b5cf9f480dac0bb769
      - run: .venv/bin/python scripts/build-container-kit.py --build dist/executor-container/BUILD.json --third-party dist/third-party/SOURCES.json
